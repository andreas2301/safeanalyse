# safeanalyze configuration file
# See README.md for documentation

scanners:
  - name: trufflehog
    command: "trufflehog filesystem {path} --json"
    enabled: true
    fail_on_findings: false
  - name: semgrep
    command: "semgrep --config=p/security-audit {path} --json"
    enabled: true
    fail_on_findings: false
  - name: gitleaks
    command: "gitleaks dir {path} --report-format json --report-path -"
    enabled: false
    fail_on_findings: false
  - name: prompt-injection-scanner
    command: "prompt-injection-scanner {path} --format json --min-severity HIGH --no-fail"
    enabled: true
    fail_on_findings: false
  - name: bumblebee
    command: "bumblebee scan --profile deep --root {path} --findings-only"
    enabled: false
    fail_on_findings: false

sanitization:
  strip_comments: true
  remove_non_ascii: true
  max_file_size_bytes: 50000
  max_lines_per_file: 500
  allowed_extensions:
    - .go
    - .py
    - .js
    - .ts
    - .jsx
    - .tsx
    - .rs
    - .java
    - .c
    - .cpp
    - .h
    - .rb
    - .php
    - .swift
    - .kt
    - .scala
    - .sh
    - .bash
    - .zsh
    - .yaml
    - .yml
    - .sql
    - .html
    - .xml
    - .css
    - .lua
    - .r
  excluded_paths:
    - .git
    - target
    - build
    - dist
    - .venv
    - __pycache__
    - .idea
    - .vscode
    - .tox
    - .pytest_cache
    - .mypy_cache
  # Dependency paths are skipped in fast mode but scanned in thorough mode.
  # Move an entry here to excluded_paths if it should never be scanned.
  dependency_paths:
    - node_modules
    - vendor

hidden_chars:
  enabled: true
  categories:
    - zero_width
    - bidi
    - control
  fail_on_findings: true

entropy:
  enabled: true
  threshold: 4.5
  min_length: 20
  fail_on_findings: false

yara:
  enabled: true
  fail_on_findings: true

ml:
  enabled: false
  model_path: ""
  threshold: 0.5
  batch_size: 4
  max_file_size_bytes: 1048576
  timeout_seconds: 300
  allowed_extensions:
    - .go
    - .py
    - .js
    - .ts
    - .jsx
    - .tsx
    - .rs
    - .java
    - .c
    - .cpp
    - .h
    - .rb
    - .php
    - .swift
    - .kt
    - .md
    - .txt
    - .yaml
    - .yml
    - .json
    - .sql
  excluded_paths:
    - .git
    - node_modules
    - vendor
    - target
    - build
    - dist
    - .venv
    - __pycache__
    - .idea
    - .vscode
  fail_on_findings: false

output:
  formats:
    - markdown
    - json
    - html
    - sarif
  single_file: false
  include_file_tree: true
  out_dir: ./safeanalyze-out

sandbox:
  mode: none
  docker_image: alpine:latest
  firejail_profile: default

# Intent checks: call home, auto-run, dependency sources, install scripts, CI,
# browser extensions, behaviour chains, AI-agent files, licenses (thorough mode).
intent:
  enabled: true
  # Unlike sanitization.excluded_paths, build/, dist/ and editor folders are
  # scanned: code that runs automatically often lives there.
  excluded_paths:
    - .git
    - node_modules
    - .venv
    - __pycache__
    - .tox
    - .pytest_cache
    - .mypy_cache
  # Exit with status 2 when any Tier A (verdict-relevant) finding exists.
  fail_on_tier_a: true
  # `scan --network` downloads direct, non-vendored dependencies (Go modules,
  # npm packages from package-lock.json) and scans their source. Nothing is
  # installed or executed. Off by default.
  network:
    enabled: false
    max_packages: 300
    timeout_seconds: 600
    go_binary: go
